name: Publish candidate images to GHCR
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag
        required: true
        default: v0.1.3-dev.4

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch gateway-core dependency
        run: |
          python3 scripts/dependencies.py fetch gateway-core
          python3 scripts/dependencies.py check gateway-core
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push gateway image
        run: |
          version="${{ inputs.version }}"
          core_dir=$(python3 scripts/dependencies.py path gateway-core)
          docker build -t "ghcr.io/zombiebox-tv/gateway:$version" -f Dockerfile "$core_dir"
          docker push "ghcr.io/zombiebox-tv/gateway:$version"
      - name: Build and push youtube-pot image
        run: |
          version="${{ inputs.version }}"
          core_dir=$(python3 scripts/dependencies.py path gateway-core)
          docker build -t "ghcr.io/zombiebox-tv/youtube-pot:$version" -f "$core_dir/wrappers/youtube-pot/Dockerfile" "$core_dir"
          docker push "ghcr.io/zombiebox-tv/youtube-pot:$version"
      - name: Build and push youtube image
        run: |
          version="${{ inputs.version }}"
          core_dir=$(python3 scripts/dependencies.py path gateway-core)
          docker build -t "ghcr.io/zombiebox-tv/youtube:$version" -f "$core_dir/wrappers/youtube/Dockerfile" "$core_dir"
          docker push "ghcr.io/zombiebox-tv/youtube:$version"
